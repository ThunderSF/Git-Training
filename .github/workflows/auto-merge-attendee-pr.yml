name: Merge after comment

# Workshop-only convenience. When ANYONE (including the pull request author)
# leaves a comment on the PR, this turns on auto-merge. GitHub then merges the
# PR as soon as the required "Check attendee file" check passes. Anyone may
# comment, so people taking the course on their own can comment on their own PR.
# Bot comments are ignored, including this workflow's own replies, so it can't loop.
#
# Why issue_comment and nothing else:
#   Workflows triggered by review events on PRs from forks get a read-only
#   token and cannot merge. issue_comment always runs in the context of this
#   repository's default branch with a write token. The tradeoff is that only
#   comments in the main Conversation comment box count, not line comments or
#   submitted reviews. The lab tells people to post a comment in that box.
#
# Security: this workflow never checks out or runs code from the pull request.
# All event values are passed through env vars, never interpolated into scripts.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-merge:
    # Only comments on pull requests, not on plain issues
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENTER: ${{ github.event.comment.user.login }}
      COMMENTER_TYPE: ${{ github.event.comment.user.type }}
    steps:
      - name: Ignore bot comments
        id: gate
        run: |
          if [ "$COMMENTER_TYPE" = "Bot" ]; then
            echo "Comment is from a bot. Nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm the pull request is open, targets main and has no auto-merge yet
        id: pr
        if: steps.gate.outputs.proceed == 'true'
        run: |
          eligible=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,baseRefName,isDraft,autoMergeRequest \
            --jq 'select(.state == "OPEN" and .baseRefName == "main" and (.isDraft | not) and .autoMergeRequest == null) | "yes"')
          if [ "$eligible" = "yes" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pull request is closed, a draft, not aimed at main, or already set to auto-merge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable merge
        if: steps.pr.outputs.eligible == 'true'
        run: |
          # --auto waits for required checks. If the checks already passed, GitHub
          # refuses --auto ("clean status"), so fall back to merging right away.
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
             || gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Thanks @${COMMENTER}. Your comment started the merge. This pull request will merge automatically once the **Check attendee file** check passes."
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Could not enable the automatic merge. Most likely there is a merge conflict or the check failed. Open the **Checks** tab for details, fix the problem, and push again."
          fi
